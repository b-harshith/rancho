name: UDISE Scraper Cloud Job

on:
  schedule:
    - cron: '0 */6 * * *'  # Trigger automatically every 6 hours
  workflow_dispatch:      # Allow manual trigger from GitHub Actions tab

# A scheduled continuation may be queued while the previous run is still active.
# Keep one scraper writer at a time so two runners never overwrite the same HF DB.
concurrency:
  group: udise-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-0

    - name: Install PyTorch CPU and Headless OpenCV
      run: |
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install opencv-python-headless

    - name: Install Python dependencies
      run: |
        cd external_scrapers/schools_udise_yellowslate
        pip install -r requirements.txt
        pip install huggingface_hub pandas pyarrow

    - name: Restore SQLite Database from Hugging Face Hub
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO: herseiiii/udise-data
      run: |
        cd external_scrapers/schools_udise_yellowslate
        python -c "
        import os, shutil
        from huggingface_hub import hf_hub_download
        try:
            downloaded = hf_hub_download(
                repo_id='${{ env.HF_REPO }}',
                filename='udise_data.sqlite3',
                repo_type='dataset',
                token='${{ env.HF_TOKEN }}'
            )
            os.makedirs('data/runtime', exist_ok=True)
            shutil.copy2(downloaded, 'data/runtime/udise_data.sqlite3')
            print('Database successfully restored from HF Dataset.')
        except Exception as e:
            print('No existing database found or download failed:', e)
        "

    - name: Run Scraper Batch
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO: herseiiii/udise-data
        UDISE_HEADLESS: '1'
        UDISE_CHROME: /usr/bin/google-chrome
        # 2 vCPUs / 7 GB RAM runner. Chrome is I/O-bound (network waits), so 8 concurrent
        # sessions is safe: ~350 MB each = ~2.8 GB Chrome + ~1.3 GB OS/Python/EasyOCR < 7 GB
        UDISE_BROWSER_CONCURRENCY: '8'
        # Persist resumable state without repeatedly rebuilding the large Parquet export.
        UDISE_CHECKPOINT_INTERVAL_SECONDS: '1800'
      run: |
        cd external_scrapers/schools_udise_yellowslate
        python run_cli_batch.py

    - name: Send Progress Email Report
      if: always()
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO: herseiiii/udise-data
        RECIPIENT_EMAIL: bejjankiharshith1234@gmail.com
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
      run: |
        cd external_scrapers/schools_udise_yellowslate
        python send_progress_email.py
