name: UDISE Scraper Cloud Job

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

# CRITICAL: prevent concurrent runs that cause LFS bloat
concurrency:
  group: udise-scraper
  cancel-in-progress: false  # let running job finish, queue next

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-0

    - name: Install PyTorch CPU and Headless OpenCV
      run: |
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install opencv-python-headless

    - name: Install Python dependencies
      run: |
        cd external_scrapers/schools_udise_yellowslate
        pip install -r requirements.txt
        pip install huggingface_hub pandas pyarrow

    - name: Restore state from Parquet (no SQLite download - prevents LFS bloat)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO: herseiiii/udise-data
      run: |
        cd external_scrapers/schools_udise_yellowslate
        python restore_from_parquet.py

    - name: Run Scraper Batch
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO: herseiiii/udise-data
        UDISE_HEADLESS: '1'
        UDISE_CHROME: /usr/bin/google-chrome
        # 2 vCPUs / 7 GB RAM runner — Chrome is I/O-bound so 8 concurrent is safe
        UDISE_BROWSER_CONCURRENCY: '8'
      run: |
        cd external_scrapers/schools_udise_yellowslate
        python run_cli_batch.py

    - name: Send Progress Email Report
      if: always()
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO: herseiiii/udise-data
        RECIPIENT_EMAIL: bejjankiharshith1234@gmail.com
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
      run: |
        cd external_scrapers/schools_udise_yellowslate
        python send_progress_email.py
